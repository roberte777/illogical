name: Illogical

options:
  bundleIdPrefix: dev.illogical
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  groupSortPosition: top

packages:
  IllogicalKit:
    path: Packages/IllogicalKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Illogical:
    type: application
    platform: macOS
    # Shaders.metal compiles into the bundle's default.metallib. That needs
    # Xcode's Metal toolchain, which since Xcode 16 is a separate download:
    # `xcodebuild -downloadComponent MetalToolchain`.
    sources:
      - path: Illogical
    dependencies:
      - package: IllogicalKit
        product: IllogicalProtocol
      # Produced by `just xcframework`. Statically linked, so it is not
      # embedded in the bundle.
      - framework: Frameworks/ghostty-vt.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: Illogical
        PRODUCT_BUNDLE_IDENTIFIER: dev.illogical.Illogical
        INFOPLIST_FILE: Illogical/Supporting/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Illogical/Terminal/Renderer/ShaderTypes.h
        CODE_SIGN_ENTITLEMENTS: Illogical/Supporting/Illogical.entitlements
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
    scheme:
      testTargets:
        - IllogicalRendererTests

  # The renderer has no dependency on libghostty: it consumes a plain
  # TerminalSnapshot. That lets these tests drive it end to end — build a
  # screen, render it to an IOSurface, read the pixels back — without a
  # terminal, a socket or the XCFramework.
  IllogicalRendererTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Illogical/Terminal/Renderer
      # The engine and its snapshot extraction are the other half of the
      # render path, and the only part that touches libghostty.
      - path: Illogical/Terminal/TerminalEngine.swift
      - path: Illogical/Terminal/SnapshotRestore.swift
      - path: Tests
    dependencies:
      - framework: Frameworks/ghostty-vt.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.illogical.RendererTests
        SWIFT_OBJC_BRIDGING_HEADER: Illogical/Terminal/Renderer/ShaderTypes.h
        GENERATE_INFOPLIST_FILE: true
