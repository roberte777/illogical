name: Illogical

options:
  bundleIdPrefix: dev.illogical
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  groupSortPosition: top

packages:
  IllogicalKit:
    path: Packages/IllogicalKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Illogical:
    type: application
    platform: macOS
    # Shaders.metal compiles into the bundle's default.metallib. That needs
    # Xcode's Metal toolchain, which since Xcode 16 is a separate download:
    # `xcodebuild -downloadComponent MetalToolchain`.
    sources:
      - path: Illogical
        excludes:
          # The staged server is a copy-files phase of its own, below. Without
          # this it would also be swept up by the recursive scan above and land
          # in Resources, where an executable is signed as data and
          # notarization rejects the bundle.
          - "Supporting/bin/**"
          # Supporting/Fonts/ is a resource directory, so everything in it is
          # copied into the bundle. OFL.txt has to be; its manifest does not.
          - Supporting/Fonts/README.md
      # illogicald, put here by `just stage-daemon` from zig-out/bin and
      # gitignored, exactly as `just xcframework` stages the XCFramework.
      # Copied into Contents/MacOS/ and re-signed on the way in, so
      # `Bundle.main.url(forAuxiliaryExecutable:)` finds it --
      # `LocalDaemon.executable()` is the one reader.
      #
      # The daemon alone. The `illogical` CLI cannot join it: this directory
      # already holds the app's own executable `Illogical`, and the default
      # macOS volume is case-insensitive, so a file named `illogical` copied in
      # here *is* that file. It replaced the app -- same inode -- and the
      # bundle then failed `codesign --verify --deep`. The CLI ships in the
      # standalone tarball.
      #
      # A prebuilt artifact rather than a script phase that runs zig, for three
      # concrete reasons: ENABLE_USER_SCRIPT_SANDBOXING (above) gives a script
      # phase only its declared inputs and no network, while zig wants
      # .zig-cache and may fetch; zig is not on Xcode's PATH outside the
      # devshell; and the devshell variables zig needs -- SDKROOT, LD -- are
      # precisely the ones xcodebuild must not see, which is what the
      # justfile's `xcenv` strips.
      - path: Illogical/Supporting/bin
        buildPhase:
          copyFiles:
            destination: executables
            subpath: ""
        attributes: [CodeSignOnCopy]
    dependencies:
      - package: IllogicalKit
        product: IllogicalProtocol
      # Produced by `just xcframework`. Statically linked, so it is not
      # embedded in the bundle.
      - framework: Frameworks/ghostty-vt.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: Illogical
        PRODUCT_BUNDLE_IDENTIFIER: dev.illogical.Illogical
        INFOPLIST_FILE: Illogical/Supporting/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Illogical/Terminal/Renderer/ShaderTypes.h
        CODE_SIGN_ENTITLEMENTS: Illogical/Supporting/Illogical.entitlements
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
    scheme:
      testTargets:
        - IllogicalRendererTests

  # The renderer has no dependency on libghostty: it consumes a plain
  # TerminalSnapshot. That lets these tests drive it end to end — build a
  # screen, render it to an IOSurface, read the pixels back — without a
  # terminal, a socket or the XCFramework.
  IllogicalRendererTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Illogical/Terminal/Renderer
      # The engine and its snapshot extraction are the other half of the
      # render path, and the only part that touches libghostty.
      - path: Illogical/Terminal/TerminalEngine.swift
      - path: Illogical/Terminal/SnapshotRestore.swift
      # Input is encoded by libghostty against the terminal's own modes, so
      # its tests need the same engine the renderer tests do. The surface
      # view comes with them: the wiring from an NSEvent to bytes on the wire
      # is only worth anything if the responder methods are in the test too.
      - path: Illogical/Terminal/Input
      - path: Illogical/Terminal/Selection
      - path: Illogical/Terminal/TerminalSurfaceView.swift
      - path: Illogical/Terminal/ScrollAccumulator.swift
      - path: Illogical/Terminal/ScrollbarOverlay.swift
      # The split tree and the tab list it lives in — the model files only,
      # not the views over them. That is the point of keeping them apart: a
      # layout is testable without a window, a socket or a terminal.
      - path: Illogical/Splits/SplitTree.swift
      - path: Illogical/Splits/TabLayout.swift
      # SessionStore owns the layout -- tabs, splits, selection -- across every
      # machine; HostConnection owns one machine's sessions, terminals and
      # per-pane connections. A window holds several of the latter at once,
      # which is what makes the reconcile worth testing across hosts and not
      # only across sessions.
      - path: Illogical/Sessions/SessionStore.swift
      - path: Illogical/Sessions/HostConnection.swift
      - path: Illogical/Sessions/Reconnect.swift
      - path: Illogical/Terminal/TerminalController.swift
      # The pane view, for its `TerminalSurfaceDelegate` coordinator -- the one
      # line that turns ⌘W into a store call. It was outside the target, so
      # rewriting `surfaceShouldClose` to `return false` -- which is precisely
      # the bug #41 fixed, one level up from where the fix went -- failed
      # nothing at all.
      #
      # The rest come with it, and only because it does not compile without
      # them: PaneHeader is half of a pane, Chrome carries `Metrics` and
      # `TerminalLabel`, SessionMenu declares the `Palette.menu*` colours
      # `ConnectionBanner` draws with, and WindowClose is the window half of
      # closing that PaneHeader now routes through.
      - path: Illogical/Terminal/TerminalPane.swift
      - path: Illogical/Splits/PaneHeader.swift
      - path: Illogical/App/Chrome.swift
      - path: Illogical/App/SessionMenu.swift
      - path: Illogical/App/WindowClose.swift
      # The font the app ships. Without it in the test bundle the renderer
      # tests would resolve the default family to the system's fixed-pitch
      # face and measure a grid the app never draws.
      - path: Illogical/Supporting/Fonts
        excludes:
          - README.md
      # The renderer and the controller both emit launch signposts.
      - path: Illogical/App/Signposts.swift
      - path: Illogical/App/Palette.swift
      - path: Illogical/App/Trace.swift
      - path: Tests
    dependencies:
      - framework: Frameworks/ghostty-vt.xcframework
        embed: false
      - package: IllogicalKit
        product: IllogicalProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.illogical.RendererTests
        SWIFT_OBJC_BRIDGING_HEADER: Illogical/Terminal/Renderer/ShaderTypes.h
        GENERATE_INFOPLIST_FILE: true
